name: Windows x64

# Unsigned Windows build for this fork. No signing secrets are required.

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: windows-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The reusable build job requests contents: write. A caller that grants
    # only contents: read is rejected before any job starts (startup_failure).
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      platform: windows-latest
      target: x86_64-pc-windows-msvc
      build-args: ""
      sign-binaries: false
      upload-artifacts: true
      asset-prefix: voxa-windows-x64
    secrets: inherit
